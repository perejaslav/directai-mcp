[auth]
login = "agency-login"          # token owner; key in keyring; managing account

[defaults]
include_vat = true             # reports with VAT
max_rows = 50                  # default table rows
# goals = []
attribution = ["AUTO"]
units_warn_pct = 10            # остаток баллов ниже % лимита → предупреждение

# all = auth_login + кеш accounts_discover − exclude.
[accounts]
exclude = []                   # логины, никогда не входящие в account="all"

# Короткие имена/роли (необязательно). Старые секции [accounts.*] трактуются
# так же, с предупреждением в лог.
[aliases.msk]
login = "agency-login"
role = "Поиск, Москва и МО"

[aliases.regions]
login = "client-e"
role = "Поиск, регионы"

[aliases.rsya]
login = "client-c"
role = "РСЯ, регионы"

[metrika]
# counter_id = 0

[paths]
reports_dir = "~/.directai/reports"

[guard]
guard = true                   # test-campaign write protection
