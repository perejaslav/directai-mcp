# goals.toml — названия целей Метрики для отчётов.
# Формат: "id" = "Название". В отчётах цель показывается как «Название (id)»;
# если названия нет (пусто или строки нет) — голый id.
# Табличная форма: name + counter (счётчик неосновного счётчика) + value_type
# (crm | conditional, default conditional). value_type — fallback:
# при доступной Метрике тип берётся из Management API (cdp_order_* → crm).
# Список id across campaigns выдаёт агент; названия вписывает владелец.
# Файл необязателен: без него отчёты показывают голые id.

[goals]
# Пример:
# "900000019" = "Офлайн PAID"
# "900000020" = "Офлайн IN_PROGRESS"
# CRM-цель (выручка, ДРР/ROI):
# [goals."900000023"]
# name = "CRM: Заказ создан"
# value_type = "crm"
