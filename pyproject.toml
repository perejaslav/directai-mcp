[project]
name = "directai-mcp"
version = "1.4.1"
description = "Local MCP server for Yandex Direct"
authors = [
    { name = "perejaslav", email = "perejaslav@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "keyring",
    "mcp>=1,<2",
    "pydantic>=2,<3",
]

[project.scripts]
directai-mcp = "directai_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
